<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GPS satellite</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(820px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.gs {
  --gs-up: #e8760c;
}

.iso[data-theme="dark"] .gs {
  --gs-up: #ffa040;
}

.gs-pulse {
  fill: var(--gs-up);
  stroke: var(--anatomy-paper);
  stroke-width: 0.6;
}

.gs .iso-plate {
  overflow: hidden;
}

.gs-stage {
  position: relative;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: crosshair;
}

.gs-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.gs-said {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.gs-stage > svg,
.gs-stage > canvas {
  display: block;
  width: 100%;
  height: auto;
}

.gs-stage > .gs-layer {
  position: absolute;
  inset: 0;
  height: 100% !important;
  pointer-events: none;
}

.iso:not([data-theme="light"]) .gs-gl {
  mix-blend-mode: screen;
}

.gs-stage[data-gl] .gs-fallback {
  display: none;
}

@media (max-width: 560px) {
  .gs-stage {
    width: 116%;
    margin: -4% -8% -2%;
  }
}

10.23 MHz reference, and 1575.42 MHz L1 is 154 times that. On L1 it sends a 1,023-chip code that repeats every millisecond, and over the code a 50 bit/s navigation message. Part of that message is the satellite's own position (ephemeris) and how far its clock is off (clock correction), and both come up from the ground. Monitor stations watch every satellite, the master station predicts its orbit and clock, and a ground antenna uploads the prediction on S-band (1783.74 MHz), about once a day. The satellite cannot fix itself: it can only pass the new numbers on. A receiver uses them to turn travel time into range. From 20,180 km up the Earth fills ±13.9° of the sky, so a signal takes 67.3 ms to reach the point directly below and 86.0 ms to reach the horizon. At 60° elevation it takes 69.5 ms. That is 3–4 navigation bits in flight, and each bit is 5,996 km long. The older the uploaded prediction gets, the larger the range error (red band, 1 m drawn as 10 units, an illustrative fit of about 0.25 m when fresh and 0.76 m a day later). Here the signal moves 40× slower than light, and the hours between uploads pass 10,800× faster.</span></figcaption></figure></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {

      gl.viewport(0, 0, canvas.width, canvas.height);
      set("uCanvas", [canvas.width, canvas.height]);
      set("uView", view);
      set("uOrigin", camera.origin);
      set("uK", camera.k);
      set("uCam", camera.cam);
      set("uTime", time);
      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      painted = false;
    },
  };
}

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}
// GPS truth for the figure: one source for the drawing, the shader, the readout and the caption.

const C_KM_S = 299792.458;
const RE_KM = 6371;
const ALT_KM = 20180;
const RS_KM = RE_KM + ALT_KM;
const F0_MHZ = 10.23;
const L1_MHZ = 154 * F0_MHZ;
const S_UP_MHZ = 1783.74;
const CHIP_RATE = 1.023e6;
const CODE_MS = 1023 / CHIP_RATE * 1000;
const BIT_MS = 20;
const SUBFRAME_S = 6;
const MASK_DEG = (Math.asin(RE_KM / RS_KM) * 180) / Math.PI;

// Bench scale: the nadir path, 20,180 km, is drawn 240 units long.
const NADIR_UNITS = 240;
const UNITS_PER_KM = NADIR_UNITS / ALT_KM;
const RE_UNITS = RE_KM * UNITS_PER_KM;
const RS_UNITS = RS_KM * UNITS_PER_KM;

// The signal is shown slowed: one 20 ms nav bit takes BIT_SHOWN seconds to leave the antenna.
const BIT_SHOWN = 0.8;
const SLOW = BIT_SHOWN / (BIT_MS / 1000);
const BIT_UNITS = C_KM_S * (BIT_MS / 1000) * UNITS_PER_KM;
const SPEED = BIT_UNITS / BIT_SHOWN;

// Data age between uploads runs fast: HOURS_PER_S hours of age per second on screen.
const HOURS_PER_S = 3;
const UPLOAD_EVERY_H = 24;

const DEG = Math.PI / 180;

const offNadirOf = (elevDeg) => Math.asin((RE_KM * Math.cos(elevDeg * DEG)) / RS_KM) / DEG;
const centralOf = (elevDeg) => 90 - elevDeg - offNadirOf(elevDeg);
const rangeKm = (elevDeg) => Math.sqrt(RS_KM ** 2 - (RE_KM * Math.cos(elevDeg * DEG)) ** 2) - RE_KM * Math.sin(elevDeg * DEG);
const delayMs = (elevDeg) => (rangeKm(elevDeg) / C_KM_S) * 1000;

function elevOfCentral(gammaDeg) {
  let lo = 0, hi = 90;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    if (centralOf(mid) > gammaDeg) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}

// Signal-in-space range error against age of the broadcast data: an illustrative fit to
// Block IIF behaviour, about 0.25 m just after an upload and under 0.8 m a day later.
const ureOf = (ageH) => Math.hypot(0.25, 0.03 * ageH);

const fmt = (value, digits = 0) => value.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
const D = {"W":760,"H":480,"P":{"origin":[329.0525679663864,241.1723429066439],"scale":0.9901901184476118,"azimuth":40,"elevation":30},"camera":{"origin":[329.0525679663864,241.1723429066439],"k":1.2525024363545458,"cam":[0.6427876096865393,0.766044443118978,0.49999999999999994,0.8660254037844387]},"A":[-78,0,58],"zs":58,"earth":[237.7700693756194,0,75.77006937561943],"rxR":69.27006937561943,"mask":0.2399532974275922,"sb":[-102,-20,84],"feed":[180.16805795003197,-21.870738091680355,79.3231547707991],"speed":89.13551774033695,"bitShown":0.8,"bitUnits":71.30841419226957,"unitsPerKm":0.011892963330029732,"pulse":[[553.7,265.9],[558,268.5],[558.5,268.9],[558.8,269.2],[559,269.6],[559,270],[558.8,270.4],[558.4,270.8],[549.8,278.1],[549.4,278.5],[549.2,278.9],[549.2,279.3],[549.3,279.6],[549.6,280],[550.2,280.4],[557.3,284.6],[552.5,286.6],[541.7,280.2],[541,279.8],[540.2,279.6],[539.4,279.4],[538.6,279.4],[537.8,279.5],[536.9,279.7],[536.1,280],[526.8,283.8],[526,284.2],[525.1,284.3],[524.3,284.4],[523.5,284.4],[522.7,284.2],[522,284],[521.2,283.6],[518.5,282]]};
const stage = document.querySelector(".gs-stage");
const svg = stage.querySelector(".gs-back");
const rxPart = stage.querySelector('[data-part="receiver"]');
const pulse = stage.querySelector(".gs-pulse");
const RELAY = 1.4;
const PULSE_LEN = [0];
for (let i = 1; i < D.pulse.length; i++) PULSE_LEN.push(PULSE_LEN[i - 1] + Math.hypot(D.pulse[i][0] - D.pulse[i - 1][0], D.pulse[i][1] - D.pulse[i - 1][1]));
const pulseAt = (share) => {
  const want = share * PULSE_LEN[PULSE_LEN.length - 1];
  let i = 1;
  while (i < PULSE_LEN.length - 1 && PULSE_LEN[i] < want) i++;
  const t = (want - PULSE_LEN[i - 1]) / Math.max(1e-6, PULSE_LEN[i] - PULSE_LEN[i - 1]);
  return [D.pulse[i - 1][0] + (D.pulse[i][0] - D.pulse[i - 1][0]) * t, D.pulse[i - 1][1] + (D.pulse[i][1] - D.pulse[i - 1][1]) * t];
};
const readout = document.querySelector("[data-readout]");
const said = stage.querySelector(".gs-said");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const LIGHT = (stage.closest("[data-theme]")?.getAttribute("data-theme") ?? "dark") === "dark" ? 0 : 1;
const RAD = Math.PI / 180;
const STREAM = 120;
const UP_LEN = Math.hypot(D.sb[0] - D.feed[0], D.sb[1] - D.feed[1], D.sb[2] - D.feed[2]);
const freshOf = (ageH) => Math.exp(-ageH / 10);
const f3 = (v) => v.map((n) => n.toFixed(3)).join(",");

const FRAGMENT = `
uniform float uT;
uniform vec3 uNew;
uniform vec4 uRx;
uniform float uBand;
uniform vec4 uUp;
uniform float uFirst;
uniform float uLight;
const vec3 A=vec3(${f3(D.A)});
const vec3 E=vec3(${f3(D.earth)});
const float ZS=${D.zs.toFixed(2)};
const float MASK=${D.mask.toFixed(5)};
const float SPEED=${D.speed.toFixed(4)};
const float BIT=${D.bitShown.toFixed(4)};
const float BITU=${D.bitUnits.toFixed(4)};
const vec3 SB=vec3(${f3(D.sb)});
const vec3 FEED=vec3(${f3(D.feed)});
const float UPLEN=${UP_LEN.toFixed(3)};
const vec3 DARK_OLD=vec3(.36,.46,.62);
const vec3 DARK_NEW=vec3(.30,.78,1.);
const vec3 DARK_UP=vec3(1.,.6,.2);
const vec3 DARK_ERR=vec3(1.,.3,.26);
const vec3 INK_OLD=vec3(.44,.52,.62);
const vec3 INK_NEW=vec3(.05,.42,.80);
const vec3 INK_UP=vec3(.93,.49,.06);
const vec3 INK_ERR=vec3(.84,.18,.14);
float h1(float n){return hash12(vec2(n,17.31));}
// x: energy in old-data signal, y: energy in fresh-data signal
vec2 fanAt(vec2 q,float px){
  vec2 d=q-A.xy;float r=length(d);
  float c=d.x/max(r,1e-3);float s=d.y/max(r,1e-3);
  float soft=max(.012,1.4*px/max(r,1.));
  float ang=(1.-smoothstep(MASK-soft,MASK+soft*.3,abs(s)))*smoothstep(.2,.5,c);
  float Dd=E.x-A.x;float disc=E.z*E.z-Dd*Dd*s*s;
  float rho=disc>0.?Dd*c-sqrt(disc):1e4;
  float w=ang*(1.-smoothstep(rho-.9,rho+.3,r))*(1.-smoothstep(300.,345.,r))*smoothstep(1.,14.,r);
  if(w<.001)return vec2(0.);
  float spread=inversesqrt(max(r,48.)/48.);
  float tau=uT-r/SPEED;
  float bit=tau/BIT;float n=floor(bit);float f=bit-n;
  float b=step(.5,h1(n));float flip=abs(b-step(.5,h1(n-1.)));
  float edge=min(f,1.-f)*BITU;
  float front=exp(-edge*edge/(1.2+px*px))*(.32+.68*flip);
  float ep=fract(bit*20.);float ee=min(ep,1.-ep)*BITU/20.;
  float fine=smoothstep(3.,6.,BITU/20./px);
  float epoch=exp(-ee*ee/(.18+px*px*.6))*.3*fine;
  float e=w*spread*(.2+.12*b+1.3*front+epoch);
  float fr=mix(uNew.z,uNew.y,smoothstep(-.015,.015,tau-uNew.x));
  return vec2(e*(1.-fr),e*fr);
}
float bandAt(vec2 q){
  vec2 d=q-A.xy;float r=length(d);
  float phi=atan(d.y,d.x);
  float across=1.-smoothstep(.045,.07,abs(phi-uRx.w));
  return window(r,uRx.z-uBand,uRx.z+uBand,.7)*across;
}
vec2 upAt(vec2 vb,float px){
  vec2 pa=project(FEED);vec2 pb=project(SB);vec2 ab=pb-pa;
  float t=clamp(dot(vb-pa,ab)/dot(ab,ab),0.,1.);
  float dist=length(vb-pa-ab*t)/uK;
  float along=t*UPLEN;
  float env=window(along,uUp.y,uUp.x,2.5)*uUp.z;
  float core=exp(-dist*dist/(1.1+px*px));
  float ph=fract((along-uT*SPEED)/9.);
  float blob=exp(-pow((ph-.5)*9./1.7,2.));
  float hit=length(vb-pb)/uK;
  return vec2(core*(.35+.9*blob)*env,exp(-hit*hit/14.)*uUp.w);
}
vec4 inkOf(float e,vec3 colour,float cap){float a=cap*(1.-exp(-2.2*e));return vec4(colour*a,a);}
vec4 over(vec4 top,vec4 under){return top+under*(1.-top.a);}
void main(){
  vec2 vb=viewOf(gl_FragCoord.xy);
  float px=pixelOf();
  vec2 fan=fanAt(onFloor(vb,ZS).xy,px/uCam.z);
  float band=bandAt(onFloor(vb,ZS).xy)*1.3;
  vec2 up=upAt(vb,px);
  vec4 outc;
  if(uLight<.5){
    vec3 col=fan.x*DARK_OLD+fan.y*DARK_NEW+band*DARK_ERR+(up.x+up.y)*DARK_UP;
    col=tonemap(col,1.35);
    float m=max(col.r,max(col.g,col.b));
    outc=vec4(col,m);
  }else{
    vec4 ink=inkOf(fan.x,INK_OLD,.62);
    ink=over(inkOf(fan.y,INK_NEW,.85),ink);
    ink=over(inkOf(band,INK_ERR,.78),ink);
    ink=over(inkOf(up.x+up.y,INK_UP,.9),ink);
    outc=ink;
  }
  outc*=uFirst;
  outc.rgb=min(outc.rgb,vec3(outc.a));
  float n=(hash12(gl_FragCoord.xy+fract(uTime*.61)*91.)+hash12(gl_FragCoord.yx*1.37+fract(uTime*.37)*57.)-1.)/255.;
  outc=max(outc+n*smoothstep(0.,1.5/255.,outc.a),0.);
  gl_FragColor=outc;
}`;

const layer = glLayer({
  canvas: stage.querySelector(".gs-gl"),
  fragment: FRAGMENT,
  view: [D.W, D.H],
  camera: D.camera,
  uniforms: ["uT", "uNew", "uRx", "uBand", "uUp", "uFirst"],
  fixed: { uLight: LIGHT },
});
if (layer) stage.setAttribute("data-gl", "");

const rxAt = (elevDeg) => {
  const g = centralOf(elevDeg) * RAD;
  return [D.earth[0] - D.rxR * Math.cos(g), D.earth[1] + D.rxR * Math.sin(g)];
};

const S = {
  elev: 60,
  elevTarget: 60,
  t: 0,
  age: 6,
  ageOld: 6,
  phase: "day",
  relayAt: -1e9,
  upAt: -1e9,
  arriveAt: -1e9,
  split: -1e9,
  rxGotAt: -1e9,
  holdUntil: 0,
  band: { x: ureOf(6) * 10, v: 0 },
  up: { x: 0, v: 0 },
  first: { x: 0, v: 0 },
};
let touring = !still.matches;
let tourClock = 0;
let idleTimer = 0;
let frame = 0;
let last = 0;
let visible = false;
let lastSaid = "";

const announce = (text) => {
  if (text !== lastSaid) {
    lastSaid = text;
    said.textContent = text;
  }
};

function startUpload() {
  if (S.phase !== "day") return;
  S.phase = "relay";
  S.relayAt = S.t;
  S.ageOld = S.age;
  announce("Master control predicts a new orbit and clock correction");
}

function step(dt) {
  const calm = still.matches;
  S.t += dt;
  if (touring) {
    tourClock += dt;
    const stops = [60, 22, 82, 40];
    S.elevTarget = stops[Math.floor(tourClock / 3.6) % stops.length];
  }
  S.elev = calm ? S.elevTarget : S.elev + (S.elevTarget - S.elev) * (1 - Math.exp(-dt / 0.35));
  if (Math.abs(S.elev - S.elevTarget) < 0.01) S.elev = S.elevTarget;
  const rx = rxAt(S.elev);
  const rho = Math.hypot(rx[0] - D.A[0], rx[1] - D.A[1]);

  if (S.phase === "day") {
    S.age += HOURS_PER_S * dt;
    if (touring && S.age >= UPLOAD_EVERY_H) {
      S.age = UPLOAD_EVERY_H;
      startUpload();
    }
  }
  if (S.phase === "relay" && S.t - S.relayAt >= RELAY) {
    S.phase = "upload";
    S.upAt = S.t;
    announce("Uploading fresh corrections on S-band");
  }
  const share = (S.t - S.relayAt) / RELAY;
  if (share >= 0 && share <= 1.05) {
    const [px, py] = pulseAt(Math.min(1, share));
    pulse.setAttribute("cx", px.toFixed(1));
    pulse.setAttribute("cy", py.toFixed(1));
    pulse.style.opacity = (smooth(0, 0.08, share) * (1 - smooth(0.92, 1.05, share))).toFixed(3);
  } else if (pulse.style.opacity !== "0") pulse.style.opacity = "0";
  const head = (S.t - S.upAt) * D.speed;
  if (S.phase === "upload") {
    if (head >= UP_LEN && S.arriveAt < S.upAt) S.arriveAt = S.t;
    if (head - STREAM >= UP_LEN) {
      S.phase = "broadcast";
      S.split = S.t;
      S.age = 0;
      announce("Satellite broadcasting the new data on L1");
    }
  }
  if (S.phase === "broadcast" && (S.t - S.split) * D.speed >= rho) {
    S.phase = "updated";
    S.rxGotAt = S.t;
    S.holdUntil = S.t + 1.6;
    announce("Receiver has the new data; range error back to " + ureOf(0).toFixed(2) + " m");
  }
  if (S.phase === "updated" && S.t >= S.holdUntil) {
    S.phase = "day";
    S.ageOld = S.age;
  }
  const rxAge = S.phase === "relay" || S.phase === "upload" || S.phase === "broadcast" ? S.ageOld : S.age;
  settle(S.band, ureOf(rxAge) * 10, dt, 0.45, calm);
  settle(S.up, S.phase === "upload" || head - STREAM < UP_LEN + 20 ? (S.phase === "upload" ? 1 : 0) : 0, dt, 0.25, calm);
  settle(S.first, 1, dt, 0.5, calm);

  rxPart.setAttribute("transform", translateAlong(D.P, [rx[0], rx[1], 0]));
  const elevText = Math.round(S.elev);
  let text;
  if (S.phase === "relay") text = `monitor → master control · new orbit & clock`;
  else if (S.phase === "upload") text = `uploading · S-band ${S_UP_MHZ.toFixed(2)} MHz`;
  else if (S.phase === "broadcast") text = `new data on L1 · ${delayMs(S.elev).toFixed(1)} ms to receiver`;
  else if (S.phase === "updated") text = `receiver updated · URE ${ureOf(0).toFixed(2)} m`;
  else text = `elev ${elevText}° · ${delayMs(S.elev).toFixed(1)} ms · age ${Math.floor(S.age)} h · URE ${ureOf(S.age).toFixed(2)} m`;
  if (readout.textContent !== text) readout.textContent = text;

  if (layer) {
    const freshNew = freshOf(S.phase === "upload" || S.phase === "relay" ? S.ageOld : S.age);
    const freshOld = freshOf(S.ageOld);
    const tail = head - STREAM;
    layer.draw(
      {
        uT: S.t,
        uNew: [S.split, S.phase === "day" || S.phase === "relay" ? freshOf(S.phase === "day" ? S.age : S.ageOld) : freshNew, S.phase === "day" ? freshOf(S.age) : freshOld],
        uRx: [rx[0], rx[1], rho, Math.atan2(rx[1] - D.A[1], rx[0] - D.A[0])],
        uBand: S.band.x,
        uUp: [Math.min(head, UP_LEN + 40), tail, S.up.x, calm ? 0 : burst(S.t - S.arriveAt, 0.08, 0.5)],
        uFirst: S.first.x,
      },
      calm ? 0.8 : S.t,
    );
  }
}

const describe = () => {
  stage.setAttribute("aria-valuenow", String(Math.round(S.elevTarget)));
  stage.setAttribute("aria-valuetext", `Receiver at ${Math.round(S.elevTarget)} degrees elevation, ${fmt(rangeKm(S.elevTarget))} km from the satellite, ${delayMs(S.elevTarget).toFixed(1)} milliseconds of travel`);
};

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  step(still.matches ? 0 : dt);
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
const steer = (elev) => {
  touring = false;
  S.elevTarget = Math.max(5, Math.min(90, elev));
  describe();
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    touring = !still.matches;
    tourClock = 0;
    run();
  }, 3600);
  if (still.matches) step(0);
  run();
};

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);
addEventListener("resize", () => step(0));

stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  const box = svg.getBoundingClientRect();
  const share = Math.max(0, Math.min(1, ((event.clientX - box.left) / box.width - 0.15) / 0.7));
  steer(5 + share * 85);
});
stage.addEventListener("click", (event) => {
  if (event.pointerType === "touch") {
    const box = svg.getBoundingClientRect();
    steer(5 + Math.max(0, Math.min(1, ((event.clientX - box.left) / box.width - 0.15) / 0.7)) * 85);
  }
  steer(S.elevTarget);
  startUpload();
});
stage.addEventListener("keydown", (event) => {
  const big = event.shiftKey ? 15 : 5;
  let to = null;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = S.elevTarget + big;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = S.elevTarget - big;
  if (event.key === "Home") to = 90;
  if (event.key === "End") to = 5;
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    steer(S.elevTarget);
    startUpload();
    return;
  }
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
stage.addEventListener("focus", () => {
  said.textContent = "";
  lastSaid = "";
  announce(`Receiver at ${Math.round(S.elevTarget)} degrees; data ${Math.floor(S.age)} hours old`);
});
if (still.matches) {
  S.first.x = 1;
  touring = false;
}
describe();
step(0);
